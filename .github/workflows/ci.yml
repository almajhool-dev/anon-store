name: CI / Deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run build:api
      # نشر الواجهة (اختياري — يعمل فقط عند إضافة الأسرار في GitHub)
      - name: Deploy web to Netlify
        if: github.ref == 'refs/heads/main' && env.NETLIFY_AUTH_TOKEN != ''
        run: npx -y netlify-cli@latest deploy --prod --dir dist/web --site "$NETLIFY_SITE_ID"
      # نشر الواجهة الخلفية (اختياري): رفع الحزمة للتخزين وتحديث بصمة المُحمِّل
      - name: Publish API to Neon
        if: github.ref == 'refs/heads/main' && env.NEON_API_KEY != ''
        env:
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ secrets.NEON_BRANCH_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.NEON_STORAGE_ENDPOINT }}
          AWS_REGION: eu-central-1
        run: node scripts/publish-api.mjs
